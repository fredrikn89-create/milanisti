name: Post nye artikler til X
on:
  push:
    branches: [main]
    paths: ['discord/queue.json', 'x/post.py', 'x/config.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: x-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post
        env:
          X_NO_API_KEY: ${{ secrets.X_NO_API_KEY }}
          X_NO_API_SECRET: ${{ secrets.X_NO_API_SECRET }}
          X_NO_ACCESS_TOKEN: ${{ secrets.X_NO_ACCESS_TOKEN }}
          X_NO_ACCESS_SECRET: ${{ secrets.X_NO_ACCESS_SECRET }}
          X_EN_API_KEY: ${{ secrets.X_EN_API_KEY }}
          X_EN_API_SECRET: ${{ secrets.X_EN_API_SECRET }}
          X_EN_ACCESS_TOKEN: ${{ secrets.X_EN_ACCESS_TOKEN }}
          X_EN_ACCESS_SECRET: ${{ secrets.X_EN_ACCESS_SECRET }}
          X_IT_API_KEY: ${{ secrets.X_IT_API_KEY }}
          X_IT_API_SECRET: ${{ secrets.X_IT_API_SECRET }}
          X_IT_ACCESS_TOKEN: ${{ secrets.X_IT_ACCESS_TOKEN }}
          X_IT_ACCESS_SECRET: ${{ secrets.X_IT_ACCESS_SECRET }}
        run: python3 x/post.py
      - name: Lagre hva som er postet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase -q
          git add x/posted.json
          git diff --cached --quiet || (git commit -m "Oppdater X-postet-liste" && git push)
